{% extends "base.html" %}
{% block title %}设置 - 实践型知识库{% endblock %}
{% block content %}
<section class="page-head"><h1>设置</h1><p>AI 是可选建议模块；未配置时，核心手动功能照常使用。</p></section>
<form class="form panel" method="post">
  <label>服务商<select name="ai_provider">
    {% for p in ['','OpenAI','ChatGPT API Compatible','DeepSeek','Kimi','自定义 OpenAI Compatible API'] %}
      <option value="{{ p }}" {% if settings.get('ai_provider')==p %}selected{% endif %}>{{ p or '未启用' }}</option>
    {% endfor %}
  </select></label>
  <label>API URL<input name="ai_api_url" value="{{ settings.get('ai_api_url','') }}"></label>
  <label>API Key<input name="ai_api_key" type="password" value="{{ settings.get('ai_api_key','') }}"></label>
  <label>模型名称<input name="ai_model" value="{{ settings.get('ai_model','') }}"></label>
  <button class="button primary">保存设置</button>
</form>
{% endblock %}
