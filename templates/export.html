{% extends "base.html" %}
{% block title %}导出与备份 - 实践型知识库{% endblock %}
{% block content %}
<section class="page-head"><h1>导出与备份</h1><p>所有导出都会生成新文件，不覆盖已有文件。</p></section>
<section class="grid three">
  <div class="panel"><h2>数据库备份</h2><form method="post" action="{{ url_for('backup') }}"><button class="button primary">一键备份 SQLite</button></form></div>
  <div class="panel"><h2>JSON 导出</h2><a class="button" href="{{ url_for('export_json') }}">导出全部 JSON</a></div>
  <div class="panel"><h2>CSV 导出</h2><a class="button" href="{{ url_for('export_csv', table='books') }}">书籍 CSV</a><a class="button" href="{{ url_for('export_csv', table='contents') }}">内容 CSV</a></div>
</section>
<form class="panel compact" method="post" action="{{ url_for('restore') }}" enctype="multipart/form-data" onsubmit="return confirm('将覆盖当前数据库，系统会先自动备份当前数据库。确定恢复吗？')">
  <h2>恢复数据库</h2>
  <input type="file" name="backup_file" accept=".db">
  <button class="button danger">恢复并覆盖当前数据库</button>
</form>
{% endblock %}
