{% extends "base.html" %}
{% block title %}{{ row.title }} - 实践详情{% endblock %}
{% block content %}
<section class="page-head"><h1>{{ row.title }}</h1><form method="post" action="{{ url_for('export_markdown', entity='experiment', entity_id=row.id) }}"><button class="button">导出 Markdown</button></form></section>
<form class="form panel" method="post">
  <label>标题<input name="title" value="{{ row.title or '' }}" required></label><label>状态<select name="status">{% for s in statuses %}<option value="{{ s }}" {% if row.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
  <label>关联内容<select name="content_id"><option value="">无</option>{% for r in contents_rows %}<option value="{{ r.id }}" {% if row.content_id==r.id %}selected{% endif %}>{{ r.title }}</option>{% endfor %}</select></label>
  <label>关联书籍<select name="book_id"><option value="">无</option>{% for r in books_rows %}<option value="{{ r.id }}" {% if row.book_id==r.id %}selected{% endif %}>{{ r.title }}</option>{% endfor %}</select></label>
  <label>关联读书感悟<select name="reading_note_id"><option value="">无</option>{% for r in notes_rows %}<option value="{{ r.id }}" {% if row.reading_note_id==r.id %}selected{% endif %}>{{ (r.source_idea or '')[:50] }}</option>{% endfor %}</select></label>
  <label>关联问题<select name="problem_id"><option value="">无</option>{% for r in problems_rows %}<option value="{{ r.id }}" {% if row.problem_id==r.id %}selected{% endif %}>{{ r.name }}</option>{% endfor %}</select></label>
  <label>想验证什么<textarea name="goal" rows="3">{{ row.goal or '' }}</textarea></label><label>当前问题<textarea name="current_problem" rows="3">{{ row.current_problem or '' }}</textarea></label>
  <label>最小测试方式<textarea name="minimum_test" rows="3">{{ row.minimum_test or '' }}</textarea></label><label>成功标准<textarea name="success_criteria" rows="3">{{ row.success_criteria or '' }}</textarea></label>
  <label>预计投入<input name="estimated_effort" value="{{ row.estimated_effort or '' }}"></label><label>开始时间<input name="started_at" value="{{ row.started_at or '' }}"></label>
  <label>实际操作<textarea name="actual_action" rows="4">{{ row.actual_action or '' }}</textarea></label><label class="important">实际结果<textarea name="actual_result" rows="4">{{ row.actual_result or '' }}</textarea></label>
  <label>遇到的问题 / 不适用原因<textarea name="issues_found" rows="3">{{ row.issues_found or '' }}</textarea></label><label>是否有效<input name="is_effective" value="{{ row.is_effective or '' }}"></label>
  <label class="important">最终决定<textarea name="final_decision" rows="3">{{ row.final_decision or '' }}</textarea></label><label class="important">可复用结论<textarea name="reusable_conclusion" rows="4">{{ row.reusable_conclusion or '' }}</textarea></label>
  <label>下一步行动<textarea name="next_action" rows="3">{{ row.next_action or '' }}</textarea></label>
  <button class="button primary">保存实践</button>
</form>
{% endblock %}
