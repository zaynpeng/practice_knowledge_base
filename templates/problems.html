{% extends "base.html" %}
{% block title %}问题地图 - 实践型知识库{% endblock %}
{% block content %}
<section class="page-head"><h1>问题地图</h1><p>这里按“我正在解决什么问题”组织资料。</p></section>
<form class="form panel" method="post">
  <h2>新建问题</h2>
  <label>问题名称<input name="name" required></label><label>问题类型<input name="problem_type"></label>
  <label>重要程度<input name="importance"></label><label>状态<select name="status">{% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></label>
  <label>问题描述<textarea name="description" rows="3"></textarea></label><label>下一步行动<textarea name="next_action" rows="3"></textarea></label>
  <label class="wide">已有结论<textarea name="current_conclusion" rows="3"></textarea></label>
  <button class="button primary">创建问题</button>
</form>
<section class="panel list">{% for row in rows %}<a class="list-row" href="{{ url_for('problem_detail', problem_id=row.id) }}"><strong>{{ row.name }}</strong><span>{{ row.status }} · {{ row.importance }}</span><small>{{ row.next_action }}</small></a>{% else %}<p class="empty">还没有问题。</p>{% endfor %}</section>
{% endblock %}
